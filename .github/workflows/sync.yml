name: Sync Recipe Book from Google Drive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gdown
        run: pip install gdown

      - name: Download newest recipe book from the shared folder
        run: |
          gdown --folder "https://drive.google.com/drive/folders/1d8rfC_24mGyFExDBwQXWD5uGE6NUkIIk" -O src
          echo "--- Files found: ---"
          find src -type f | sort
          latest=$(find src -name 'rb_sync_2*.html' | sort | tail -n 1)
          if [ -z "$latest" ]; then
            echo "No rb_sync_*.html file in the folder yet. Leaving index.html untouched."
            exit 1
          fi
          echo "Using: $latest"
          cp "$latest" index.html
          head -c 200 index.html
          echo ""
          wc -c index.html

      - name: Commit and push if changed
        run: |
          git config user.name "recipe-book-sync-bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync recipe book from Google Drive"
            git push
          fi
