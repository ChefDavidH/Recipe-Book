name: Sync Recipe Book from Google Drive

on:
  schedule:
    - cron: '0 */6 * * *'   # runs every 6 hours
  workflow_dispatch:         # lets you trigger it manually from GitHub's Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download latest recipe book from Google Drive
        run: |
          curl -L "https://drive.google.com/uc?export=download&id=1G4a2p60ciu8hSCxGqNsNK2VUEhvdU6lL" -o index.html

      - name: Commit and push if changed
        run: |
          git config user.name "recipe-book-sync-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-sync recipe book from Google Drive"
          git push
