name: Sync Recipe Book from Google Drive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download latest recipe book from Google Drive
        run: |
          curl -L "https://drive.google.com/uc?export=download&id=1G4a2p60ciu8hSCxGqNsNK2VUEhvdU6lL" -o index.html
          echo "--- First 200 chars of downloaded file: ---"
          head -c 200 index.html
          echo ""
          echo "--- File size: ---"
          wc -c index.html

      - name: Commit and push if changed
        run: |
          git config user.name "recipe-book-sync-bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync recipe book from Google Drive"
            git push
          fi
