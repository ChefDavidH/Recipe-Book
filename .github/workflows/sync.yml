name: Sync Recipe Book from Google Drive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gdown
        run: pip install gdown

      - name: Download the shared folder
        run: |
          gdown --folder "https://drive.google.com/drive/folders/1d8rfC_24mGyFExDBwQXWD5uGE6NUkIIk" -O src
          n=$(find src -type f | wc -l)
          echo "Files in folder: $n"
          if [ "$n" -ge 40 ]; then
            echo "::warning::Folder has $n files. Time to archive old versions."
          fi

      - name: Assemble the book from the newest version of each part
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          parts = {}
          for path in glob.glob('src/**/rbp_*.html', recursive=True):
              name = os.path.basename(path)
              m = re.match(r'^(rbp_.+)_(\d{8}_\d{4})\.html$', name)
              if not m:
                  continue
              key, stamp = m.groups()
              if key not in parts or stamp > parts[key][0]:
                  parts[key] = (stamp, path)
          if not parts:
              print('No rbp_ part files found. Leaving index.html untouched.')
              sys.exit(1)
          pieces = []
          for key in sorted(parts):
              stamp, path = parts[key]
              print(key + ': using ' + os.path.basename(path))
              with open(path, encoding='utf-8') as f:
                  pieces.append(f.read())
          html = ''.join(pieces)
          problems = []
          if not html.startswith('<!DOCTYPE html>'):
              problems.append('does not start with <!DOCTYPE html>')
          if not html.rstrip().endswith('</html>'):
              problems.append('does not end with </html>')
          for tag in ('section', 'div', 'ul', 'ol'):
              opened = len(re.findall(r'<%s[\s>]' % tag, html))
              closed = html.count('</%s>' % tag)
              if opened != closed:
                  problems.append('<%s> opened %d times but closed %d times' % (tag, opened, closed))
          sections = html.count('<section class="book-section"')
          print('Sections:', sections, '| Total bytes:', len(html.encode('utf-8')))
          if sections < 10:
              problems.append('only %d sections found' % sections)
          if problems:
              print('PROBLEMS FOUND. Leaving index.html untouched:')
              for p in problems:
                  print(' - ' + p)
              sys.exit(1)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print('index.html written.')
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "recipe-book-sync-bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync recipe book from Google Drive"
            git push
          fi
